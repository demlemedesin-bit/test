<header class="pn">
  <a class="pn-logo" href="/"><span>Demleme</span><img src="/demleme/01-brand/logo/logo-still.png" alt=""></a>
  <nav class="pn-links"><a class="on" href="/#magaza">{{t:nav_shop}}</a><a href="/#konuklar">{{t:nav_guests}}</a><a href="/#hakkinda">{{t:nav_about}}</a><a href="/#iletisim">{{t:nav_contact}}</a></nav>
  <a class="pn-acc" href="/hesabim">{{t:nav_account}}</a><a class="pn-cart" href="/sepet" aria-label="Sepet"><img src="/demleme/01-brand/icons/cart.png" alt=""><span class="pn-count" id="cartCount">0</span></a>
</header>
<main>
  <p class="crumb" id="crumb"></p>
  <section class="pp" id="pp">
    <div class="pp-media">
      <div class="pp-main"><img id="ppImg" src="" alt=""><span class="pp-badge" id="ppBadge"></span></div>
      <div class="pp-thumbs" id="ppThumbs"></div>
    </div>
    <div class="pp-info">
      <p class="pp-cat" id="ppCat"></p>
      <h1 class="pp-name" id="ppName"></h1>
      <p class="pp-price" id="ppPrice"></p>
      <p class="pp-desc" id="ppDesc"></p>
      <div class="pp-opt" id="ppColors"></div>
      <div class="pp-opt" id="ppSizes"></div>
      <div class="pp-buy"><div class="qty"><button type="button" id="qMinus" aria-label="Azalt">−</button><span id="qN">1</span><button type="button" id="qPlus" aria-label="Arttır">+</button></div>
        <button type="button" class="pp-add" id="ppAdd"><span class="dbtn"><img src="/demleme/06-urun/svg/btn-sepete-ekle-base.svg" alt="Sepete ekle"><img class="dbtn-arr" src="/demleme/06-urun/svg/btn-sepete-ekle-arrow.svg" alt=""></span></button></div>
      <p class="pp-msg" id="ppMsg" aria-live="polite"></p>
      <div id="pxHeart"></div>
      <div id="pxStock"></div>
      <div class="pp-det" id="ppDet"></div>
    </div>
  </section>
  <section class="pv" id="pxVideo" hidden></section>
  {{REVIEWS}}
  {{RELATED}}
</main>
<div id="pxRecent"></div>
<footer class="pf"><span>{{t:footer_copy}}</span><span><a href="/">Ana sayfa</a> · <a href="/kargo-ve-iade">Kargo ve iade</a> · <a href="/kvkk">KVKK</a> · <a href="/siparis-takip">Sipariş takibi</a></span></footer>
{{PRODUCT_DATA}}
